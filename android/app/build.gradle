plugins {
    id "com.android.application"
    id "kotlin-android"
    id 'com.google.gms.google-services'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'com.google.firebase.crashlytics'
    id "dev.flutter.flutter-gradle-plugin"
}

def flutterVersionCode = 11
def flutterVersionName = "1.11"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.ferdidrgn.ticketapp"
    compileSdk = 36 // flutter.compileSdkVersion yerine direkt sayı

    defaultConfig {
        applicationId = "com.ferdidrgn.ticketapp"
        minSdkVersion = flutter.minSdkVersion // flutter.minSdkVersion yerine
        targetSdk = 36 // flutter.targetSdkVersion yerine
        versionCode = flutterVersionCode
        versionName = flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            // Crashlytics'in hata raporlarını okunabilir kılması için mapping dosyasını ister
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.android.support:multidex:1.0.3'

    // 🚀 Flutter'ın native tarafta Material 3 ve AppCompat kullanabilmesi için bunlar kalmalı
    implementation "androidx.appcompat:appcompat:1.7.0" // Versiyon güncellendi
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.core:core-ktx:1.13.1"

    // Firebase Bill of Materials (BoM) - Versiyon karmaşasını önler
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Kotlin stdlib artık çoğu zaman otomatik eklenir, manuel yazmaya gerek yok.
     implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
}
