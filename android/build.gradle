buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1' // Android Gradle Pluginugin
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20' // Kotlin Gradle Plugin
        classpath 'com.google.gms:google-services:4.4.1' // Google Services Plugin
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
