<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="TiyatRol - Tiyatro Bilet Satış Uygulaması">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ticketapp">

    <!-- 🎯 MOBİL WEB: Viewport ayarları -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- 🎯 MOBİL WEB: Video autoplay izni -->
    <meta name="mobile-web-app-capable" content="yes">

    <title>TiyatRol</title>
    <link rel="manifest" href="manifest.json">

    <style>
        /* 🎯 MOBİL WEB: Tam ekran ve scroll engelleme */
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          position: fixed;
          background-color: #0a0a1a;
        }

        #loading {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background: linear-gradient(135deg, #0A1628 0%, #1a1a2e 50%, #16213e 100%);
        }

        .loader {
          width: 48px;
          height: 48px;
          border: 3px solid #D4AF37;
          border-bottom-color: transparent;
          border-radius: 50%;
          display: inline-block;
          box-sizing: border-box;
          animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="loading">
    <span class="loader"></span>
</div>

<!-- 🎯 KRİTİK: HTML Renderer ayarı (Mobil video için) -->
<script>
    // HTML renderer zorla (mobil video oynatma için gerekli)
    window.flutterWebRenderer = "html";
</script>

<script src="main.dart.js" type="application/javascript"></script>

<script>
    // 🎯 MOBİL WEB: Loading ekranını kaldır
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.querySelector('#loading');
      if (loading) {
        loading.remove();
      }
    });
</script>
</body>
</html>
