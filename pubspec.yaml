name: ticketapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+20

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Utils
  # Localization (Resmi Paketler)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # Yerelleştirme ve tarih formatları için şart
  flutter_web_plugins:
    sdk: flutter

  # State Management & Logic
  equatable:
  dartz:
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  freezed_annotation:
  json_annotation:

  # Network & Storage
  dio:
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  cached_network_image:

  # Media
  video_player: ^2.7.0
  audioplayers: ^6.0.0
  image_picker:
  youtube_player_iframe: ^6.0.2

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth:
  cloud_firestore:
  firebase_storage:
  firebase_app_check: ^0.4.1+4
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3
  flutter_local_notifications: ^19.4.0
  cloud_functions: ^6.4.0

  # Google Services
  google_sign_in: ^5.0.0
  google_maps_flutter:
  google_mobile_ads:

  app_links: ^6.1.1
  geolocator: ^14.0.3

  # UI Components
  curved_navigation_bar:
  permission_handler:
  simple_html_css:
  universal_html: ^2.2.4
  qr_flutter:
  mobile_scanner: ^7.4.0
  shimmer: ^3.0.0
  url_launcher:
  share_plus: ^12.0.1
  go_router:
  dynamic_color: ^1.8.1
  visibility_detector: ^0.4.0+2
  package_info_plus: ^8.1.2
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.2.1

  # Tasarım Sistemi 2.0 (Bento / Glassmorphism)
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generators
  flutter_lints:
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.3
  json_serializable:

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/app_logo.jpg
    - assets/images/app_near_logo.jpg
    - assets/images/book_logo.jpg
    - assets/images/tiyatrol_logo.png
    - assets/images/main_theatre.png


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ================================================
# NATIVE SPLASH SCREEN CONFIGURATION
# ================================================
flutter_native_splash:
  color: "#0A1628"
  background_image: "assets/images/app_logo.jpg.png"
  image: "assets/images/tiyatrol_logo.png"

  android_12:
    image: "assets/images/tiyatrol_logo.png"
    color: "#0A1628"
    image_dark: "assets/images/tiyatrol_logo.png"
    color_dark: "#0A1628"
    icon_background_color: "#0A1628"

  color_dark: "#0A1628"
  background_image_dark: "assets/images/app_logo.jpg"
  image_dark: "assets/images/tiyatrol_logo.png"
  android_navbar_color: "#0A1628"


  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: center

  fullscreen: true
