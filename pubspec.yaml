name: ticketapp  # Paket adı, diğer paketler tarafından referans alınır.
description: "A new Flutter project."  # Paket hakkında kısa bir açıklama.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+6 # Uygulama sürümü ve yapı numarası.

environment:
  sdk: '>=3.4.4 <4.0.0'  # Desteklenen Dart SDK sürümleri.

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.

# Paketinizin çalışması için gereken bağımlılıkları belirtir.
dependencies:
  flutter:
    sdk: flutter  # Flutter SDK bağımlılığı.

  # Cupertino İkonları fontunu uygulamanıza ekler.
  # cupertino_icons: ^1.0.8  # Kullanım için yorum satırına alındı.

  #flutter_launcher_icons: ^0.9.2

  # State Yönetimi
  equatable: # Nesne karşılaştırmaları için kullanılır.
  dartz:  # Fonksiyonel programlama yapıları sağlar.

  #Resim - Video
  cached_network_image:  #Resimleri önbelleğe alır.
  video_player: ^2.7.0   #Video Oynatıcısı
  audioplayers: ^6.0.0   #Ses Oynatıcısı

  # Yerel Depolama
  shared_preferences:  # Kalıcı veri depolamak için.

  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  flutter_widget_from_html: ^0.15.3

  # Firebase
  firebase_core: ^4.2.0  # Firebase temel yapı.
  cloud_firestore:   # Firebase'in NoSQL veritabanı.
  firebase_storage:   # Firebase dosya depolama hizmeti.
  firebase_auth:  # Firebase kimlik doğrulama.

  # Google
  google_sign_in: ^5.0.0  # Google ile giriş yapma.
  google_maps_flutter:  # Google Haritalar entegrasyonu.

  # Diğer bağımlılıklar
  curved_navigation_bar:  # En son sürüm.
  permission_handler:   # İzin yönetimi için.
  simple_html_css:   # HTML/CSS işleme.
  pinput:  # Giriş alanı için.
  qr_flutter:   # QR kod oluşturma.
  shimmer: ^3.0.0   # Görüntü yükseltme.

  # URL ve Dosya Seçimi ve Paylaşım
  url_launcher:   # URL açmak için.
  image_picker: # Kamera ve galeriye erişim için.
  file_picker:   # Dosya seçimi için.
  share_plus: ^12.0.1
  go_router:   #Web sayfasında link adlarını ayarlama ve gitme işlemlerini yapıyor

  # Uluslararasılaştırma
  intl: # Tarih ve sayı biçimlendirme için.

  # Diğer Kütüphaneler
  flutter_riverpod:  # State yönetimi için Riverpod.
  freezed_annotation:  # Immutable veri sınıfları için.
  riverpod_annotation:  # Riverpod için anotasyon desteği.
  json_annotation: # JSON veri sınıfları için.


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Kod Üretimi
  flutter_lints:   # Kod kalitesini artıran lint kuralları.
  injectable_generator:  # Injectable için otomatik kod üretimi.
  build_runner: # Kod üretimi aracı.
  freezed: # Freezed ile veri sınıfları oluşturur.
  riverpod_generator: # Riverpod için kod üretimi.
  json_serializable:  # JSON veri sınıfları için.

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # Uygulamaya varlık eklemek için assets bölümünü kullanın.
  assets:
    - assets/images/app_logo.jpg
    - assets/images/app_near_logo.jpg
    - assets/images/book_logo.jpg
    - assets/images/tiyatrol_logo.png
    # Web logosunu kullanıyorsan:
    # - web/tiyatrol_logo.png
