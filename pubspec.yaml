name: ticketapp  # Paket adı, diğer paketler tarafından referans alınır.
description: "A new Flutter project."  # Paket hakkında kısa bir açıklama.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+9 # Uygulama sürümü ve yapı numarası.

environment:
  sdk: '>=3.4.4 <4.0.0'  # Desteklenen Dart SDK sürümleri.

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.

# Paketinizin çalışması için gereken bağımlılıkları belirtir.
dependencies:
  flutter:
    sdk: flutter  # Flutter SDK bağımlılığı.

  # Cupertino İkonları fontunu uygulamanıza ekler.
  # cupertino_icons: ^1.0.8  # Kullanım için yorum satırına alındı.

  #flutter_launcher_icons: ^0.9.2

  # State Yönetimi
  equatable: # Nesne karşılaştırmaları için kullanılır.

  # Fonksiyonel Programlama
  dartz:  # Fonksiyonel programlama yapıları sağlar.

  # Ağ
  dio: # HTTP istekleri için kullanılan bir ağ kütüphanesi.

  #Resim - Video
  cached_network_image:  #Resimleri önbelleğe alır.
  video_player: ^2.7.0   #Video Oynatıcısı
  audioplayers: ^6.0.0   #Ses Oynatıcısı

  # Yerel Depolama
  flutter_secure_storage: ^9.2.2  # Kalıcı veri depolamak için.

  # Servis Lokasyonu
  connectivity_plus: ^6.0.3

  # Firebase
  firebase_core: ^4.3.0  # Firebase temel yapı.
  cloud_firestore:   # Firebase'in NoSQL veritabanı.
  firebase_storage:   # Firebase dosya depolama hizmeti.
  firebase_auth:  # Firebase kimlik doğrulama.
  firebase_app_check:

  # Google
  google_sign_in: ^5.0.0  # Google ile giriş yapma.
  google_maps_flutter:  # Google Haritalar entegrasyonu.

  # Diğer bağımlılıklar
  curved_navigation_bar:  # En son sürüm.
  permission_handler:   # İzin yönetimi için.
  simple_html_css:   # HTML/CSS işleme.
  pinput:  # Giriş alanı için.
  qr_flutter:   # QR kod oluşturma.
  shimmer: ^3.0.0   # Görüntü yükseltme.

  # URL ve Dosya Seçimi ve Paylaşım
  url_launcher:   # URL açmak için.
  image_picker: # Kamera ve galeriye erişim için.
  file_picker:   # Dosya seçimi için.
  share_plus: ^12.0.1
  go_router:   #Web sayfasında link adlarını ayarlama ve gitme işlemlerini yapıyor

  # Uluslararasılaştırma
  intl: # Tarih ve sayı biçimlendirme için.

  # Diğer Kütüphaneler
  flutter_riverpod: ^3.0.3  # State yönetimi için Riverpod.
  freezed_annotation:  # Immutable veri sınıfları için.
  riverpod_annotation: ^3.0.3  # Riverpod için anotasyon desteği.
  json_annotation: # JSON veri sınıfları için.

  # Web Plugins
  flutter_web_plugins:
    sdk: flutter
  visibility_detector: ^0.4.0+2
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter  # Flutter test kütüphanesi.

  # Kod Üretimi
  flutter_lints:   # Kod kalitesini artıran lint kuralları.
  injectable_generator:  # Injectable için otomatik kod üretimi.
  build_runner: ^2.10.4 # Kod üretimi aracı.
  freezed: # Freezed ile veri sınıfları oluşturur.
  riverpod_generator: ^3.0.3 # Riverpod için kod üretimi.
  json_serializable:  # JSON veri sınıfları için.

  # Native Splash Screen
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
# Flutter paketleri için özel alanlar.
flutter:
  uses-material-design: true  # Material tasarım ikonlarının kullanımını sağlar.

  # To add assets to your application, add an assets section, like this:
  # Uygulamaya varlık eklemek için assets bölümünü kullanın.
  assets:
    - assets/images/app_logo.jpg  # Uygulama logosu.
    - assets/images/app_near_logo.jpg  # Yakın logo.
    - assets/images/book_logo.jpg  # Kitap logosu.
    - assets/images/tiyatrol_logo.png  # Tiyatrol logosu.
    - assets/images/main_theatre.png


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ================================================
# NATIVE SPLASH SCREEN CONFIGURATION
# ================================================
flutter_native_splash:
  color: "#0A1628"
  background_image: "assets/images/app_logo.jpg.png"
  image: "assets/images/tiyatrol_logo.png"

  android_12:
    image: "assets/images/tiyatrol_logo.png"
    color: "#0A1628"
    image_dark: "assets/images/tiyatrol_logo.png"
    color_dark: "#0A1628"
    icon_background_color: "#0A1628"

  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: center

  color_dark: "#0A1628"
  background_image_dark: "assets/images/app_logo.jpg"
  image_dark: "assets/images/tiyatrol_logo.png"

  fullscreen: true
  android_navbar_color: "#0A1628"