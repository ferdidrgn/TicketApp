name: ticketapp  # Paket adı, diğer paketler tarafından referans alınır.
description: "A new Flutter project."  # Paket hakkında kısa bir açıklama.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+6 # Uygulama sürümü ve yapı numarası.

environment:
  sdk: '>=3.4.4 <4.0.0'  # Desteklenen Dart SDK sürümleri.

dependencies:
  flutter:
    sdk: flutter  # Flutter SDK bağımlılığı.
    # Cupertino İkonları fontunu uygulamanıza ekler.
    # cupertino_icons: ^1.0.8  # Kullanım için yorum satırına alındı.
    #flutter_launcher_icons: ^0.9.2

  # ------------------------------------------------
  # STATE MANAGEMENT & ARCHITECTURE
  # ------------------------------------------------
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  dartz: ^0.10.1

  # ------------------------------------------------
  # FIREBASE & BACKEND
  # ------------------------------------------------
  firebase_core: ^4.2.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.7.1
  firebase_storage: ^12.4.1

  # ------------------------------------------------
  # GOOGLE SERVICES
  # ------------------------------------------------
  google_sign_in: ^6.2.2
  google_maps_flutter: ^2.10.0

  # ------------------------------------------------
  # NAVIGATION & ROUTING
  # ------------------------------------------------
  go_router: ^14.6.2
  curved_navigation_bar: ^1.0.6

  # ------------------------------------------------
  # NETWORK & CONNECTIVITY
  # ------------------------------------------------
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # ------------------------------------------------
  # UI & MEDIA
  # ------------------------------------------------
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  shimmer: ^3.0.0
  flutter_widget_from_html: ^0.15.3
  simple_html_css: ^3.0.0
  pinput: ^5.0.0
  qr_flutter: ^4.1.0

  # ------------------------------------------------
  # UTILITIES & SYSTEM
  # ------------------------------------------------
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  intl: ^0.20.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  share_plus: ^12.0.1

  # ------------------------------------------------
  # WEB SPECIFIC
  # ------------------------------------------------
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ------------------------------------------------
  # CODE GENERATION
  # ------------------------------------------------
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

  # ------------------------------------------------
  # SPLASH SCREEN
  # ------------------------------------------------
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  # ------------------------------------------------
  # ASSETS
  # ------------------------------------------------
  assets:
    - assets/images/app_logo.jpg
    - assets/images/app_near_logo.jpg
    - assets/images/book_logo.jpg
    - assets/images/tiyatrol_logo.png

# ================================================
# NATIVE SPLASH SCREEN CONFIGURATION
# ================================================
flutter_native_splash:
  # Background color
  color: "#0A1628"

  # Background image (gradient effect)
  background_image: "assets/images/splash_background.png"

  # Logo image
  image: "assets/images/tiyatrol_logo.png"

  # Android 12+ specific settings
  android_12:
    image: "assets/images/tiyatrol_logo.png"
    color: "#0A1628"
    image_dark: "assets/images/tiyatrol_logo.png"
    color_dark: "#0A1628"
    icon_background_color: "#0A1628"

  # Platform settings
  android: true
  ios: true
  web: false

  # Logo positioning
  android_gravity: center
  ios_content_mode: center

  # Dark mode support
  color_dark: "#0A1628"
  background_image_dark: "assets/images/splash_background.png"
  image_dark: "assets/images/tiyatrol_logo.png"

  # Fullscreen mode
  fullscreen: true

  # Android navigation bar color
  android_navbar_color: "#0A1628"