name: ticketapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+18

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Utils
  # Localization (Resmi Paketler)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # Yerelleştirme ve tarih formatları için şart
  flutter_web_plugins:
    sdk: flutter

  # State Management & Logic
  equatable:
  dartz:
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  freezed_annotation:
  json_annotation:

  # Network & Storage
  dio:
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  cached_network_image:

  # Media
  video_player: ^2.7.0
  audioplayers: ^6.0.0
  image_picker:
  file_picker:

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth:
  cloud_firestore:
  firebase_storage:
  firebase_app_check: ^0.4.1+4
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3

  # Google Services
  google_sign_in: ^5.0.0
  google_maps_flutter:
  google_mobile_ads:
  # "Yakınımdakiler" için GERÇEK cihaz konumu (izin + GPS koordinatı) —
  # bkz. lib/core/services/location_service.dart
  geolocator: ^13.0.2

  app_links: ^6.1.1

  # UI Components
  curved_navigation_bar:
  permission_handler:
  simple_html_css:
  universal_html: ^2.2.4
  pinput:
  qr_flutter:
  shimmer: ^3.0.0
  url_launcher:
  share_plus: ^12.0.1
  add_2_calendar: ^3.0.1
  go_router:
  dynamic_color: ^1.8.1
  visibility_detector: ^0.4.0+2
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.2.1
  confetti: ^0.8.0
  flutter_staggered_grid_view: ^0.7.0
  skeletonizer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generators
  flutter_lints:
  injectable_generator:
  build_runner: ^2.10.4
  freezed:
  riverpod_generator: ^3.0.3
  json_serializable:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/app_logo.jpg
    - assets/images/app_near_logo.jpg
    - assets/images/book_logo.jpg
    - assets/images/tiyatrol_logo.png
    - assets/images/main_theatre.png
    - assets/images/app_icon_master.png


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ================================================
# APP ICON — TÜM PLATFORMLAR (Android/iOS/Web)
# ================================================
# Kaynak: assets/images/app_icon_master.png (2000x2000, düz köşeli, arka
# planı zaten koyu lacivert #0A1628 dolu kare — flutter_launcher_icons
# kendi platform maskelerini/köşe yuvarlamasını uyguluyor, ayrı bir
# "adaptive icon" foreground/background ayrımına gerek yok).
# ÇALIŞTIRMAK GEREKİYOR (bu sandbox'ta Flutter SDK yok, derlenemedi):
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_master.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon_master.png"
    background_color: "#0A1628"
    theme_color: "#0A1628"

# ================================================
# NATIVE SPLASH SCREEN CONFIGURATION
# ================================================
# 🔥 DÜZELTME: `background_image` eskiden var olmayan bir dosyaya
# ("app_logo.jpg.png" — gerçek asset "app_logo.jpg", .png uzantısı
# yanlışlıkla eklenmişti) işaret ediyordu; flutter_native_splash bunu
# sessizce atlayıp düz beyaz arka plana düşüyordu ("küçücük bembeyaz"
# şikayetinin kök nedeni). Artık yeni logo (zaten kendi koyu lacivert
# arka planıyla geliyor) tek başına yeterli — ayrı bir background_image
# katmanına hiç gerek yok, `color` onunla birebir eşleşiyor (#0A1628).
# ÇALIŞTIRMAK GEREKİYOR: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A1628"
  image: "assets/images/app_icon_master.png"

  android_12:
    image: "assets/images/app_icon_master.png"
    color: "#0A1628"
    image_dark: "assets/images/app_icon_master.png"
    color_dark: "#0A1628"
    icon_background_color: "#0A1628"

  color_dark: "#0A1628"
  image_dark: "assets/images/app_icon_master.png"
  android_navbar_color: "#0A1628"

  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: center

  fullscreen: true
