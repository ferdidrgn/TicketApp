# Deploy Web — yeni site (site/: saf HTML + CSS + ES modülleri) -> Firebase Hosting
#
# Flutter web artık yayınlanmıyor. `site/tools/build.mjs` siteyi ön-işler
# (sitemap, JSON-LD, il/rehber sayfaları) ve `site-dist/` üretir; bu klasör
# `firebase.site.json` (hedef: web -> .firebaserc'te "tiyatrol" sitesi) ile yayınlanır.
#
# GEREKLİ SECRET: FIREBASE_SERVICE_ACCOUNT (servis hesabı JSON'u, ham).
# Servis hesabında şu roller olmalı: Firebase Hosting Admin, Service Usage Consumer,
# API Keys Viewer. (Eksik rol "403 Permission denied to get service
# firebasehosting.googleapis.com" hatası verir.)
#
# Backend (functions/rules) BURADA deploy EDİLMEZ — sırası önemli, bkz. deploy-backend.yml.
name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "firebase.site.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
  # Otomatik yenileme: yeni oyun/seans Firestore'a girince prerender + sitemap güncellensin.
  # Zamanlanmış çalışmalar YALNIZ varsayılan dalda (main) çalışır; `site/**` değişikliği gerekmez.
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC (08:00 TR)
    - cron: "0 17 * * *"  # 17:00 UTC (20:00 TR)
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Build & Deploy (site/ -> Firebase Hosting)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # yalnız cron canlı tutma adımı için (aşağıda)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site (prerender)
        run: node site/tools/build.mjs
        env:
          SITE_URL: https://tiyatrol.web.app

      - name: Sanity check
        run: |
          for f in index.html oyun.html sitemap.xml robots.txt app-ads.txt .well-known/assetlinks.json yonetim/index.html; do
            test -s "site-dist/$f" || { echo "::error::site-dist/$f eksik"; exit 1; }
          done
          echo "site-dist: $(find site-dist -type f | wc -l) dosya"

      - name: Write service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT secret'ı tanımlı değil"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase Hosting (live)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@14 deploy --only hosting:web,hosting:ekip --config firebase.site.json --project ticketappflutter --non-interactive

      # GitHub, 60 gün hiç depo etkinliği olmayınca zamanlanmış iş akışlarını sessizce DURDURUR (özellikle public depo).
      # Başarılı bir cron çalışmasının sonunda iş akışını yeniden "enable" ederek sayacı sıfırlıyoruz (aylık anlamsız commit yok).
      # Bu adım başarısız olsa bile deploy sonucu etkilenmez. İlk GitHub çalışmasında doğrulanmadı — bkz. docs/OTOMASYON.md.
      - name: Keep schedule alive
        if: github.event_name == 'schedule' && success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy-web.yml/enable"
