# Deploy Web — yeni site (site/: saf HTML + CSS + ES modülleri) -> Firebase Hosting
#
# Flutter web artık yayınlanmıyor. `site/tools/build.mjs` siteyi ön-işler
# (sitemap, JSON-LD, il/rehber sayfaları) ve `site-dist/` üretir; bu klasör
# `firebase.site.json` (hedef: web -> .firebaserc'te "tiyatrol" sitesi) ile yayınlanır.
#
# GEREKLİ SECRET: FIREBASE_SERVICE_ACCOUNT (servis hesabı JSON'u, ham).
# Servis hesabında şu roller olmalı: Firebase Hosting Admin, Service Usage Consumer,
# API Keys Viewer. (Eksik rol "403 Permission denied to get service
# firebasehosting.googleapis.com" hatası verir.)
#
# Backend (functions/rules) BURADA deploy EDİLMEZ — sırası önemli, bkz. deploy-backend.yml.
name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "firebase.site.json"
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Build & Deploy (site/ -> Firebase Hosting)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site (prerender)
        run: node site/tools/build.mjs

      - name: Sanity check
        run: |
          for f in index.html oyun.html sitemap.xml robots.txt app-ads.txt .well-known/assetlinks.json yonetim/index.html; do
            test -s "site-dist/$f" || { echo "::error::site-dist/$f eksik"; exit 1; }
          done
          echo "site-dist: $(find site-dist -type f | wc -l) dosya"

      - name: Write service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT secret'ı tanımlı değil"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase Hosting (live)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@14 deploy --only hosting:web --config firebase.site.json --project ticketappflutter --non-interactive
