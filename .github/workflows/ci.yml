# ─────────────────────────────────────────────────────────────────────────
# CI — TicketApp (TiyatRol)
#
# Her pull request'te ve `main` / `claude/next-steps-20260916` dallarına
# push'ta çalışır: bağımlılıkları çeker, statik analiz yapar ve testleri
# koşar. Bu workflow gerçek/sahte bir kimlik bilgisi veya secret KULLANMAZ.
# ─────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/next-steps-20260916

# Aynı branch/PR için eski çalışan bir CI varsa, yeni push geldiğinde onu
# iptal et (gereksiz job'ları biriktirmemek için).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.yaml -> environment.sdk: '>=3.4.4 <4.0.0'.
      # Flutter 3.24.5 stable, Dart 3.5.4 ile gelir ve bu kısıtı karşılar.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 🔥 DÜZELTME: Sabit "3.24.5" (Dart 3.5.4 taşıyor) artık pubspec.yaml
          # riverpod_generator ^3.0.3'ün gerektirdiği Dart ^3.7.0'ı
          # karşılamıyor ("version solving failed" ile CI kırılıyordu) —
          # proje zamanla ilerledi ama CI sabit kaldı. Belirli bir sürüme
          # sabitlemek yerine "stable" kanalının GÜNCELİNİ kullanıyoruz.
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Eski kodda binlerce 'info' var; yalnızca hata/uyarı CI'yı kırsın.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # NOT: `test/` dizini repo'da mevcut (test/widget_test.dart), o
      # yüzden bu adım normal şekilde çalıştırılıyor (continue-on-error
      # YOK). Dikkat: test/widget_test.dart şu an hâlâ `flutter create`
      # tarafından üretilen varsayılan "counter" şablon testi — uygulama
      # artık bir sayaç değil, bu yüzden bu test gerçek UI'ye karşı
      # BAŞARISIZ olabilir. Bu, CI kurulumunun kapsamı dışında, ayrı bir
      # görev olarak test/widget_test.dart'ın güncellenmesi/gerçek
      # testlerle değiştirilmesi gerekiyor.
      - name: Run tests
        run: flutter test

  site-build:
    name: Site build (site/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node site/tools/build.mjs
      - run: test -s site-dist/index.html && test -s site-dist/.well-known/assetlinks.json

  functions-test:
    name: Backend testleri (functions/, emülatör)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Firestore/Storage emülatörleri Java ister.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm --prefix functions ci

      # SAHTE test değerleri (gerçek sır DEĞİL). Dosya yalnız bu geçici koşucuda yaşar, commit edilmez.
      - name: Write fake local secrets
        run: |
          {
            echo 'PHONE_HASH_SALT=tiyatrol-phone-v1:ticketappflutter'
            echo 'IYZICO_API_KEY=sandbox-fake-api-key'
            echo 'IYZICO_SECRET_KEY=sandbox-fake-secret-key'
          } > functions/.secret.local

      # firebase.json'da Storage emülatörü/kuralı yok; CI için geçici bir yapılandırma üret (repo dosyası değişmez).
      - name: Prepare CI emulator config
        run: |
          cat > ci-storage.rules <<'RULES'
          rules_version = "2";
          service firebase.storage {
            match /b/{bucket}/o {
              match /{allPaths=**} { allow read, write: if true; }
            }
          }
          RULES
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('firebase.json','utf8'));c.storage={rules:'ci-storage.rules'};c.emulators.storage={port:9199};fs.writeFileSync('firebase.ci.json',JSON.stringify(c,null,2))"

      - name: Run backend tests in emulators
        run: npx -y firebase-tools@14 emulators:exec --config firebase.ci.json --project ticketappflutter --only firestore,auth,functions,storage "npm --prefix functions test"
