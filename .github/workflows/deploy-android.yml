# ─────────────────────────────────────────────────────────────────────────
# Deploy Android — Play Console (TicketApp / TiyatRol)
#
# Tetikleyiciler: manuel (`workflow_dispatch`) VEYA `main` dalına push.
# Her iki durumda da `flutter build appbundle --release` çalışır (bunun
# için imzalama gerekmez, appbundle imzasız da derlenebilir — ama gerçek
# bir yayın için release keystore ile imzalanmış olması gerekir, o yüzden
# aşağıda keystore kurulumu da var).
#
# Play Console'a otomatik yükleme adımı (r0adkll/upload-google-play)
# BİLİNÇLİ OLARAK varsayılan kapalı (`if: false`) bırakıldı — kullanıcı
# aşağıdaki secret'ları eklemeden bu adım tetiklenirse anlamsız bir
# hata/başarısızlıkla karşılaşmasın diye. Kullanıcı secret'ları
# ekledikten sonra bu satırı (`if: false`) silip devreye alabilir.
#
# GEREKLİ SECRET'LAR (hiçbiri bu dosyada gerçek değer İÇERMİYOR, sadece
# `${{ secrets.XXX }}` referansı var):
#
#   1. ANDROID_KEYSTORE_BASE64
#      Release imzalama keystore'unun (.jks / .keystore) base64 hâli.
#      Elde etmek için (yerel makinende):
#          keytool -genkey -v -keystore release-keystore.jks \
#            -keyalg RSA -keysize 2048 -validity 10000 -alias <ALIAS_ADIN>
#          base64 -i release-keystore.jks | tr -d '\n' > keystore_base64.txt
#      `keystore_base64.txt` içeriğini GitHub repo > Settings > Secrets
#      and variables > Actions > "New repository secret" ile
#      ANDROID_KEYSTORE_BASE64 adıyla ekle.
#
#   2. ANDROID_KEYSTORE_PASSWORD — keystore'un store password'ü.
#   3. ANDROID_KEY_ALIAS       — keystore içindeki key alias'ı.
#   4. ANDROID_KEY_PASSWORD    — o key'in password'ü (store password ile
#      aynı olabilir, keytool'a bağlı).
#
#   5. PLAY_STORE_SERVICE_ACCOUNT_JSON
#      Play Console API erişimi için servis hesabı JSON key'i.
#      🔥 DÜZELTME: Play Console > API access sayfasındaki eski
#      "Create new service account" (Google Cloud Console'a otomatik
#      yönlendiren) akışı artık YOK/değişti — bu yüzden doğrudan Google
#      Cloud Console'dan oluşturulup Play Console'a "Users and
#      permissions" üzerinden kullanıcı olarak davet edilmesi gerekiyor:
#        a) Google Cloud Console (console.cloud.google.com) > IAM &
#           Admin > Service Accounts > "Create Service Account" -> isim
#           ver -> Cloud rolü atlanabilir (gerekmiyor) -> Done.
#        b) Oluşan servis hesabına tıkla > Keys sekmesi > "Add Key" >
#           "Create new key" > JSON -> dosya iner.
#        c) Play Console > Users and permissions (Kullanıcılar ve
#           izinler) > "Invite new users" -> servis hesabının e-postasını
#           (...@...iam.gserviceaccount.com) yapıştır -> release
#           izinlerini ver (bu yöntemde, eski API access akışından
#           farklı olarak, istenirse "uygulama ekleyebilir" hakkı da
#           verilebiliyor).
#        d) İndirilen JSON dosyasının TÜM içeriğini GitHub repo >
#           Settings > Secrets and variables > Actions altında
#           PLAY_STORE_SERVICE_ACCOUNT_JSON adıyla ekle.
#
# Bu secret'lar eklenmeden bu workflow (upload adımı hariç) yine de
# appbundle'ı derler; sadece Play Console'a yükleme adımı atlanır.
# ─────────────────────────────────────────────────────────────────────────
name: Deploy Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-appbundle:
    name: Build App Bundle (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 🔥 DÜZELTME: Sabit "3.24.5" (Dart 3.5.4) artık pubspec.yaml'daki
          # riverpod_generator ^3.0.3'ün gerektirdiği Dart ^3.7.0'ı
          # karşılamıyor — "stable" kanalının güncelini kullanıyoruz.
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # google-services.json BİLEREK .gitignore'da (Firebase config dosyası,
      # repo'ya commit edilmiyor) — bu yüzden CI runner'ında hiç yok ve
      # Google Services Gradle plugin'i onsuz derleyemiyor ("File
      # google-services.json is missing" ile Gradle build'i düşürüyordu,
      # gerçek bir CI eksikliği, kodda bir hata değil). Signing keystore'un
      # aksine bu adım OPSİYONEL DEĞİL — Firebase olmadan uygulama zaten
      # derlenemiyor, bu yüzden secret eksikse build burada net bir hatayla
      # duruyor (aşağıdaki koşul sadece daha okunabilir bir hata mesajı
      # için, build'i "başarılı" gibi göstermiyor).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret'ı tanımlı değil — Firebase config dosyası olmadan Android build'i derlenemez."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Keystore + key.properties: sadece ANDROID_KEYSTORE_BASE64 secret'ı
      # tanımlıysa çalışır. Secret yoksa bu adım atlanır ve appbundle
      # imzasız derlenir (android/app/build.gradle: keystoreProperties
      # boşsa signingConfig uygulanmaz) — bu, CI'nin secret eklenmeden de
      # kırılmadan "derlenebilirlik" kontrolü yapmasını sağlar.
      - name: Decode signing keystore
        # 🔥 DÜZELTME: GitHub Actions `if:` koşulunda doğrudan `secrets`
        # context'ine izin vermiyor ("Unrecognized named-value: 'secrets'"
        # ile workflow doğrulama hatası veriyor) — secret önce bir `env:`
        # değişkenine atanıp `if:` koşulunda `env.*` üzerinden okunuyor.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Play Console'a otomatik yükleme — tüm gerekli secret'lar
      # (ANDROID_KEYSTORE_BASE64, PLAY_STORE_SERVICE_ACCOUNT_JSON vb.)
      # eklendi, artık aktif. `continue-on-error: true` bilerek kalıyor:
      # bu adım (ör. Play Console'da uygulama henüz hiç manuel
      # yayınlanmamışsa "no application found" gibi) başarısız olsa bile
      # asıl appbundle build+upload-artifact adımları etkilenmesin diye.
      - name: Upload to Play Console (internal track)
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}"
          packageName: com.ferdidrgn.ticketapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
